  <text x="44" y="401" fill="#64748B" class="mono" font-size="10">PILAR DIDÁCTICO 02 · SÍNTOMA SUBJETIVO VS. CAUSA RAÍZ OBJETIVA (25 PTS)</text>
  <text x="44" y="420" fill="#0F172A" class="sans" font-size="15" font-weight="700">02. Descripción del Fallo (Usuario) frente al Diagnóstico Real (Técnico)</text>
