  <text x="424" y="508" fill="#0F172A" class="sans" font-size="11">rodamiento del ventilador de 5V DC (caída del 74% de</text>
  <text x="424" y="526" fill="#0F172A" class="sans" font-size="11">caudal), (2) obstrucción del 85% del radiador de cobre</text>
  <text x="424" y="544" fill="#0F172A" class="sans" font-size="11">y (3) cristalización de pasta térmica en CPU/GPU.</text>

